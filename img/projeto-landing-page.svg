<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgLP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111A2A"/>
      <stop offset="100%" stop-color="#0D1420"/>
    </linearGradient>
    <linearGradient id="glowLP" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3E7CFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3E7CFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgLP)"/>
  <circle cx="160" cy="560" r="260" fill="url(#glowLP)"/>
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>

  <!-- Single scroll page mock, vertical -->
  <g transform="translate(280,90)">
    <rect x="0" y="0" width="240" height="420" rx="14" fill="#0A0E16" stroke="#3E7CFF" stroke-opacity="0.4"/>

    <!-- hero block -->
    <rect x="18" y="24" width="60" height="10" rx="4" fill="#3E7CFF"/>
    <rect x="18" y="48" width="204" height="16" rx="4" fill="#F2F4F8" fill-opacity="0.9"/>
    <rect x="18" y="70" width="160" height="16" rx="4" fill="#F2F4F8" fill-opacity="0.9"/>
    <rect x="18" y="100" width="204" height="8" rx="4" fill="#2A3348"/>
    <rect x="18" y="114" width="150" height="8" rx="4" fill="#2A3348"/>
    <rect x="18" y="140" width="90" height="26" rx="6" fill="#3E7CFF"/>

    <!-- feature row -->
    <rect x="18" y="196" width="66" height="66" rx="8" fill="#0D1420" stroke="#1E2A40"/>
    <rect x="93" y="196" width="66" height="66" rx="8" fill="#0D1420" stroke="#1E2A40"/>
    <rect x="168" y="196" width="54" height="66" rx="8" fill="#0D1420" stroke="#1E2A40"/>

    <!-- cta block -->
    <rect x="18" y="286" width="204" height="70" rx="8" fill="#111A2A" stroke="#1E2A40"/>
    <rect x="34" y="304" width="120" height="10" rx="4" fill="#7AA2FF"/>
    <rect x="34" y="322" width="90" height="20" rx="5" fill="#3E7CFF"/>

    <rect x="18" y="372" width="204" height="30" rx="6" fill="#0D1420"/>
